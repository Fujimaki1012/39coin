<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サンキューコイン</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    :root { --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); }
    body { background-color: #f5f7fa; font-family: sans-serif; min-height: 100vh; }
    .hero { background: var(--primary-gradient); padding: 3rem 1rem 4rem 1rem; color: white; border-radius: 0 0 25px 25px; box-shadow: 0 4px 10px rgba(255, 165, 0, 0.2); }
    .status-card { background: white; border-radius: 20px; padding: 2rem 1.5rem; margin-top: -40px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .main-btn { height: 120px; font-size: 1.5rem !important; font-weight: bold; border-radius: 20px; box-shadow: 0 8px 15px rgba(255, 165, 0, 0.3); }
    .custom-input { border-radius: 12px; border: 1px solid #e2e8f0; background-color: #f8fafc; }
    #app-container { display: none; }
    .modal-content .box { border-radius: 20px; border: none; }
    .modal-background { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
  </style>
</head>
<body>

  <div id="login-container">
    <div class="hero has-text-centered">
      <h1 class="title has-text-white is-3 mb-2">🪙 サンキューコイン</h1>
      <p class="subtitle is-6 has-text-white-ter">初期設定</p>
    </div>
    <div class="container px-4">
      <div class="status-card has-text-centered">
        <p class="has-text-grey-dark is-size-6 mb-4">メールアドレスを入力して<br>「登録」を押した後にカードをタッチ</p>
        <input class="input is-medium custom-input mb-4" type="email" id="inputEmail" placeholder="example@daiwa-hi.co.jp">
        <button class="button is-warning is-fullwidth is-medium has-text-weight-bold" style="border-radius: 12px;" onclick="saveLogin()">カードを登録して開始</button>
      </div>
    </div>
  </div>

  <div id="app-container">
    <div class="hero has-text-centered">
      <h1 class="title has-text-white is-3 mb-2">🪙 サンキューコイン</h1>
      <button class="button is-small is-light is-outlined mt-2" style="border-radius: 20px;" onclick="logout()">ログアウト</button>
    </div>
    <div class="container px-4">
      <div class="status-card has-text-centered mb-6">
        <div class="columns is-mobile">
          <div class="column">
            <p class="heading">あげる残り</p>
            <p class="title is-2 has-text-danger"><span id="remains">-</span>枚</p>
          </div>
          <div class="column">
            <p class="heading">もらった累計</p>
            <p class="title is-2 has-text-success"><span id="received">-</span>枚</p>
          </div>
        </div>
      </div>
      <button id="btnRead" class="button is-warning is-fullwidth main-btn mb-4">あげる<br><span class="is-size-6 mt-1">(NFCタッチ)</span></button>
      <p id="statusMsg" class="has-text-centered has-text-grey is-size-7">※相手のカードにタッチしてください</p>
    </div>
  </div>

  <div id="customModal" class="modal">
    <div class="modal-background" onclick="closeModal()"></div>
    <div class="modal-content px-4">
      <div class="box has-text-centered pt-5 pb-5">
        <h2 id="modalTitle" class="title is-4 mt-2 mb-5"></h2>
        <p id="modalMessage" class="subtitle is-6 mb-5"></p>
        <button class="button is-warning is-fullwidth has-text-weight-bold" style="border-radius: 12px;" onclick="closeModal()">OK</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwx574Jbn-tfZtGU1UUUBRHv7G8KfbvMfaMEhGQ60nP-H-aV-L8HQM20rhNg5ACRZCX/exec";

    function speak(text) {
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = "ja-JP"; uttr.rate = 1.2; uttr.pitch = 1.5;
      window.speechSynthesis.speak(uttr);
    }

    let modalCallback = null;
    function showModal(title, message, callback = null, sound = false) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerHTML = message.replace(/\n/g, '<br>');
      document.getElementById('customModal').classList.add('is-active');
      modalCallback = callback;
      if (sound) speak("サンキュー！");
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('is-active');
      if (modalCallback) { modalCallback(); modalCallback = null; }
    }

    const myEmail = localStorage.getItem('userEmail');
    if (myEmail) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      loadUserData(myEmail);
    }

    async function saveLogin() {
      const email = document.getElementById('inputEmail').value.trim();
      if(!email) return showModal("エラー", "メールアドレスを入力してください");
      
      showModal("カード登録", "そのままスマホに自分の社員証をタッチしてください");
      
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        ndef.onreading = async (event) => {
          try {
            await callGas({ action: 'registerUser', email: email, nfcId: event.serialNumber });
            localStorage.setItem('userEmail', email);
            showModal("完了", "カードの登録に成功しました！", () => location.reload(), true);
          } catch(e) { showModal("登録失敗", e.message); }
        };
      } catch (e) { showModal("エラー", "NFCを起動できません"); }
    }

    async function callGas(params) {
      const url = new URL(GAS_URL);
      Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
      const response = await fetch(url.toString(), { redirect: "follow" });
      const data = await response.json();
      if(data.error) throw new Error(data.error);
      return data;
    }

    async function loadUserData(email) {
      try {
        const data = await callGas({ action: 'getUserData', email: email });
        document.getElementById('remains').innerText = data.remains;
        document.getElementById('received').innerText = data.received;
      } catch(e) { showModal("エラー", e.message, logout); }
    }

    function logout() { localStorage.removeItem('userEmail'); location.reload(); }

    document.getElementById('btnRead').onclick = async () => {
      const btn = document.getElementById('btnRead');
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        btn.classList.add('is-loading');
        ndef.onreading = async (event) => {
          try {
            const res = await callGas({ action: 'sendPoint', email: myEmail, nfcId: event.serialNumber });
            showModal("🎉 送信完了！", `${res.receiver} さんへ<br>1コイン贈りました！`, () => location.reload(), true);
          } catch(e) { showModal("エラー", e.message, () => location.reload()); }
        };
      } catch (e) { showModal("エラー", "NFC失敗"); }
    };
  </script>
</body>
</html>
