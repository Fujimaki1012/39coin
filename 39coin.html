<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サンキューコイン</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      --bg-color: #f0f2f5;
      --accent-color: #FFA500;
      --card-radius: 20px;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
    }

    /* ヘッダー・ステータス固定エリア */
    .fixed-top {
      background: var(--primary-gradient);
      padding: 1.5rem 1rem 2rem 1rem;
      color: white;
      border-radius: 0 0 25px 25px;
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .status-card {
      background: white;
      border-radius: var(--card-radius);
      padding: 1rem;
      margin-top: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      color: #333;
    }

    /* 認証画面（ログイン・登録） */
    .auth-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
    }

    .auth-box {
      background: white;
      border-radius: var(--card-radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .auth-title {
      font-weight: 800;
      color: var(--accent-color);
      margin-bottom: 1rem;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 0.5rem;
    }

    .help-text {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    /* メイン画面：スクロールエリア */
    .scroll-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
      background: var(--bg-color);
    }

    .message-item {
      background: white;
      padding: 1rem;
      border-radius: 15px;
      margin-bottom: 0.8rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .msg-sender {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--accent-color);
    }

    .msg-body {
      margin-top: 0.3rem;
      font-size: 0.95rem;
    }

    .msg-date {
      font-size: 0.7rem;
      color: #999;
      text-align: right;
    }

    .custom-input {
      border-radius: 12px;
      border: 2px solid #eee;
    }

    .main-btn {
      height: 70px;
      border-radius: 15px;
      font-weight: 800;
      background: var(--primary-gradient);
      color: white;
      border: none;
      width: 100%;
    }

    #app-container {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    /* スクロールバー非表示（任意） */
    .scroll-content::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

<div id="login-container" class="auth-container">
  <div class="has-text-centered mb-5">
    <h1 class="title is-3" style="color: var(--accent-color);">🪙 サンキューコイン</h1>
  </div>

  <div class="auth-box">
    <h2 class="auth-title">🔑 すでに登録済みの方</h2>
    <p class="help-text">メールアドレスを入力して、ご自身の社員証をタッチしてください。</p>
    <input class="input custom-input mb-4" type="email" id="loginEmail" placeholder="メールアドレスを入力">
    <button id="loginBtn" class="button is-warning is-fullwidth has-text-weight-bold" onclick="doLogin()">社員証でログイン</button>
  </div>

  <div class="auth-box" style="border: 2px solid #FFD700;">
    <h2 class="auth-title">✨ 初めて利用する方</h2>
    <p class="help-text">1. メールアドレスを入力<br>2. 登録ボタンを押す<br>3. 自分の社員証をタッチして紐付けます。</p>
    <input class="input custom-input mb-4" type="email" id="regEmail" placeholder="メールアドレスを入力">
    <div class="columns is-mobile is-gapless mb-2">
      <div class="column pr-1">
        <input class="input is-small custom-input" type="text" id="regNfcInput" placeholder="USBスキャン用">
      </div>
      <div class="column is-narrow">
        <button id="regBtn" class="button is-small is-light" onclick="doRegister()">スマホで登録</button>
      </div>
    </div>
  </div>
</div>

<div id="app-container">
  <div class="fixed-top has-text-centered">
    <h1 class="title is-4 has-text-white mb-0">🪙 サンキューコイン</h1>
    
    <div class="status-card">
      <div class="columns is-mobile">
        <div class="column">
          <p class="heading">残り枚数</p>
          <p class="title is-3 has-text-danger" id="remains">-</p>
        </div>
        <div class="column">
          <p class="heading">もらった枚数</p>
          <p class="title is-3 has-text-success" id="received">-</p>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <textarea id="coinMessage" class="textarea custom-input mb-3" placeholder="感謝のメッセージ（任意）" rows="2"></textarea>
      <button id="btnSend" class="main-btn">コインをあげる<br><span class="is-size-7" style="font-weight:400;">(相手のカードにタッチ)</span></button>
    </div>
  </div>

  <div class="scroll-content">
    <p class="subtitle is-6 mb-3 has-text-grey">📥 届いたメッセージ</p>
    <div id="message-list">
      </div>
    <button class="button is-text is-fullwidth has-text-grey mt-4" onclick="logout()">ログアウト</button>
  </div>
</div>

<div id="customModal" class="modal"><div class="modal-background" onclick="closeModal()"></div><div class="modal-content px-5"><div class="box has-text-centered"><div id="modalMsgContent"></div><button class="button is-warning is-fullwidth mt-4" onclick="closeModal()">閉じる</button></div></div></div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwx574Jbn-tfZtGU1UUUBRHv7G8KfbvMfaMEhGQ60nP-H-aV-L8HQM20rhNg5ACRZCX/exec"; // ★要更新

  async function callGas(params) {
    const url = new URL(GAS_URL);
    Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
    const res = await fetch(url.toString(), { redirect: "follow" });
    return await res.json();
  }

  function renderMessages(messages) {
    const list = document.getElementById('message-list');
    list.innerHTML = messages.length ? '' : '<p class="has-text-centered is-size-7 has-text-grey-light mt-5">まだメッセージはありません</p>';
    messages.forEach(m => {
      list.innerHTML += `
        <div class="message-item">
          <div class="msg-sender">👤 ${m.senderName} さんより</div>
          <div class="msg-body">${m.text || '（メッセージなし）'}</div>
          <div class="msg-date">${m.date}</div>
        </div>
      `;
    });
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    if(!email) return alert("アドレスを入力してください");
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById('loginBtn').innerText = "カードを待機中...";
      ndef.onreading = async (event) => {
        const res = await callGas({ action: 'getUserData', email: email, nfcId: event.serialNumber });
        if(res.error) return alert(res.error);
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userNfc', event.serialNumber);
        showApp(res);
      };
    } catch(e) { alert("NFCエラー"); }
  }

  async function doRegister() {
    const email = document.getElementById('regEmail').value.trim();
    if(!email) return alert("アドレスを入力してください");
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      ndef.onreading = async (event) => {
        const res = await callGas({ action: 'register', email: email, nfcId: event.serialNumber });
        alert(res.message || res.error);
      };
    } catch(e) { alert("NFC非対応"); }
  }

  function showApp(data) {
    document.getElementById('login-container').style.display = 'none';
    document.getElementById('app-container').style.display = 'flex';
    document.getElementById('remains').innerText = data.remains;
    document.getElementById('received').innerText = data.received;
    renderMessages(data.messages || []);
  }

  document.getElementById('btnSend').onclick = async () => {
    const msg = document.getElementById('coinMessage').value;
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById('btnSend').innerText = "待機中...";
      ndef.onreading = async (event) => {
        const res = await callGas({ action: 'sendPoint', email: localStorage.getItem('userEmail'), nfcId: event.serialNumber, message: msg });
        if(res.error) alert(res.error);
        else {
          const body = `<p>${res.receiver}さんに送りました！</p>`;
          document.getElementById('modalMsgContent').innerHTML = body;
          document.getElementById('customModal').classList.add('is-active');
          window.onModalClose = () => location.reload();
        }
      };
    } catch(e) { alert("失敗"); }
  };

  function closeModal() {
    document.getElementById('customModal').classList.remove('is-active');
    if(window.onModalClose) window.onModalClose();
  }

  function logout() { localStorage.clear(); location.reload(); }

  window.onload = async () => {
    const email = localStorage.getItem('userEmail');
    const nfc = localStorage.getItem('userNfc');
    if(email && nfc) {
      const res = await callGas({ action: 'getUserData', email, nfcId: nfc });
      showApp(res);
    }
  };
</script>
</body>
</html>
