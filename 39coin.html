<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サンキューコイン</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    :root { --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); --bg-color: #f0f2f5; --accent-color: #FFA500; }
    body { background-color: var(--bg-color); font-family: sans-serif; min-height: 100vh; padding-bottom: 2rem; }
    .hero { background: var(--primary-gradient); padding: 3rem 1rem 4rem 1rem; color: white; border-radius: 0 0 35px 35px; }
    .status-card { background: white; border-radius: 24px; padding: 1.5rem; margin-top: -40px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .custom-input { border-radius: 12px; border: 2px solid #edf2f7; background-color: #f8fafc; }
    .main-btn { height: 100px; font-size: 1.2rem; font-weight: 800; border-radius: 18px; background: var(--primary-gradient); color: white; border: none; width: 100%; transition: opacity 0.3s; }
    .main-btn:disabled { opacity: 0.6; pointer-events: none; }
    .test-reg-box { margin-top: 2rem; padding: 1.5rem; border: 2px dashed #cbd5e1; border-radius: 18px; background: #fff; }
    .modal-quote { background: #fff9eb; padding: 1rem; border-radius: 10px; border-left: 5px solid var(--accent-color); margin-top: 1rem; text-align: left; }
    #app-container { display: none; }
  </style>
</head>
<body>

<div id="login-container">
  <div class="hero has-text-centered">
    <h1 class="title has-text-white is-3">🪙 サンキューコイン</h1>
    <p class="is-size-7">Ver. 1.0.3</p>
  </div>
  <div class="container px-5">
    <div class="status-card has-text-centered">
      <h2 class="title is-5 mb-5">ログイン</h2>
      <input class="input custom-input mb-4" type="email" id="loginEmail" placeholder="メールアドレスを入力">
      <button id="loginBtn" class="button is-warning is-fullwidth has-text-weight-bold" onclick="doLogin()">社員証でログイン</button>
      <div class="test-reg-box">
        <p class="is-size-7 has-text-grey mb-2">【登録】初めての方</p>
        <input class="input is-small custom-input mb-2" type="text" id="regNfcInput" placeholder="USBスキャン用 (Enter)">
        <button id="regBtn" class="button is-small is-light is-fullwidth" onclick="doRegister()">スマホのNFCで登録</button>
      </div>
    </div>
  </div>
</div>

<div id="app-container">
  <div class="hero has-text-centered"><h1 class="title has-text-white is-4">🪙 サンキューコイン</h1><p id="myEmailDisp" class="is-size-7"></p></div>
  <div class="container px-5">
    <div class="status-card has-text-centered mb-5">
      <div class="columns is-mobile"><div class="column"><p class="heading">残</p><p class="title is-3" id="remains">-</p></div><div class="column"><p class="heading">受</p><p class="title is-3" id="received">-</p></div></div>
    </div>
    <textarea id="coinMessage" class="textarea custom-input mb-4" placeholder="メッセージ（任意）" rows="2"></textarea>
    <button id="btnSend" class="main-btn">コインをあげる</button>
    <button class="button is-text is-fullwidth mt-4 has-text-grey" onclick="logout()">ログアウト</button>
  </div>
</div>

<div id="customModal" class="modal"><div class="modal-background" onclick="closeModal()"></div><div class="modal-content px-5"><div class="box has-text-centered"><div id="modalMsgContent"></div><button class="button is-warning is-fullwidth mt-4" onclick="closeModal()">閉じる</button></div></div></div>

<script>
  // ★重要：ここに最新のデプロイURLを貼る
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwx574Jbn-tfZtGU1UUUBRHv7G8KfbvMfaMEhGQ60nP-H-aV-L8HQM20rhNg5ACRZCX/exec";

  async function callGas(params) {
    const url = new URL(GAS_URL);
    Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
    const res = await fetch(url.toString(), { redirect: "follow" });
    if (!res.ok) throw new Error("通信失敗");
    return await res.json();
  }

  function showModal(title, body, callback = null) {
    document.getElementById('modalMsgContent').innerHTML = `<h3 class="title is-4">${title}</h3><div>${body}</div>`;
    document.getElementById('customModal').classList.add('is-active');
    window.modalCb = callback;
  }
  function closeModal() { document.getElementById('customModal').classList.remove('is-active'); if(window.modalCb) window.modalCb(); }

  // ボタンの状態を一括管理する関数
  function setBtnState(id, text, disabled) {
    const btn = document.getElementById(id);
    btn.innerText = text;
    btn.disabled = disabled;
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    if(!email) return alert("アドレスを入力");
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      setBtnState('loginBtn', 'カードをタッチしてください...', true);
      ndef.onreading = async (event) => {
        setBtnState('loginBtn', '照合中...', true);
        try {
          const res = await callGas({ action: 'getUserData', email: email, nfcId: event.serialNumber });
          if(res.error) {
            alert(res.error);
            setBtnState('loginBtn', '社員証でログイン', false);
            return;
          }
          localStorage.setItem('userEmail', email);
          localStorage.setItem('userNfc', event.serialNumber);
          location.reload();
        } catch(e) { 
          alert("通信エラー"); 
          setBtnState('loginBtn', '社員証でログイン', false);
        }
      };
    } catch(e) { alert("NFCエラー: Chromeを使用してください"); }
  }

  async function doRegister() {
    const email = document.getElementById('loginEmail').value.trim();
    if(!email) return alert("アドレスを入力");
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      setBtnState('regBtn', 'カードをかざしてください...', true);
      ndef.onreading = async (event) => {
        setBtnState('regBtn', '登録中...', true);
        const res = await callGas({ action: 'register', email: email, nfcId: event.serialNumber });
        alert(res.message || res.error);
        setBtnState('regBtn', 'スマホのNFCで登録', false);
      };
    } catch(e) { alert("NFC非対応"); }
  }

  document.getElementById('regNfcInput').onkeypress = async (e) => {
    if (e.key === 'Enter') {
      const email = document.getElementById('loginEmail').value;
      if(!email) return alert("アドレス入力");
      const res = await callGas({ action: 'register', email: email, nfcId: e.target.value });
      alert(res.message || res.error);
      e.target.value = "";
    }
  };

  document.getElementById('btnSend').onclick = async () => {
    const msg = document.getElementById('coinMessage').value;
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      setBtnState('btnSend', '相手のカードを待機中...', true);
      ndef.onreading = async (event) => {
        setBtnState('btnSend', '送信中...', true);
        try {
          const res = await callGas({ action: 'sendPoint', email: localStorage.getItem('userEmail'), nfcId: event.serialNumber, message: msg });
          if(res.error) {
            alert(res.error);
            setBtnState('btnSend', 'コインをあげる', false);
          } else {
            const uttr = new SpeechSynthesisUtterance("サンキュー");
            window.speechSynthesis.speak(uttr);
            showModal("🎉 完了", `${res.receiver}さんに送りました<div class="modal-quote">${msg}</div>`, () => location.reload());
          }
        } catch(e) {
          alert("通信失敗");
          setBtnState('btnSend', 'コインをあげる', false);
        }
      };
    } catch(e) { alert("NFC失敗"); }
  };

  function logout() { localStorage.clear(); location.reload(); }
  window.onload = async () => {
    const email = localStorage.getItem('userEmail');
    const nfc = localStorage.getItem('userNfc');
    if(email && nfc) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      document.getElementById('myEmailDisp').innerText = email;
      try {
        const res = await callGas({ action: 'getUserData', email, nfcId: nfc });
        document.getElementById('remains').innerText = res.remains;
        document.getElementById('received').innerText = res.received;
      } catch(e) {}
    }
  };
</script>
</body>
</html>
