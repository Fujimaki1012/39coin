<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サンキューコイン</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    :root {
      --primary-yellow: #FFD700;
      --secondary-orange: #FFA500;
      --bg-color: #f0f2f5;
      --card-radius: 20px;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
    }

    /* 上部固定エリア（黄色背景） */
    .fixed-top {
      background-color: var(--primary-yellow);
      background-image: linear-gradient(180deg, var(--primary-yellow) 0%, #FFEC8B 100%);
      padding: 1.5rem 1rem 1rem 1rem;
      border-radius: 0 0 30px 30px;
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .status-card {
      background: white;
      border-radius: var(--card-radius);
      padding: 0.8rem;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      color: #333;
    }

    /* コインをあげるボタン（目立たせる） */
    .main-btn {
      height: 85px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1.8rem !important; /* 文字を大きく */
      background: linear-gradient(135deg, #FF4500 0%, #FF8C00 100%);
      color: white;
      border: none;
      width: 100%;
      margin-top: 1rem;
      box-shadow: 0 6px 20px rgba(255, 69, 0, 0.3);
      transition: transform 0.1s;
    }

    .main-btn:active {
      transform: scale(0.98);
    }

    /* 履歴エリア（スクロール） */
    .scroll-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
    }

    .message-item {
      background: white;
      padding: 1rem;
      border-radius: 15px;
      margin-bottom: 0.8rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* 送り主と日付を一行に（両端揃え） */
    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid #f5f5f5;
      padding-bottom: 0.2rem;
    }

    .msg-sender {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--secondary-orange);
    }

    .msg-date {
      font-size: 0.7rem;
      color: #bbb;
    }

    .msg-body {
      font-size: 1rem;
      color: #444;
      line-height: 1.4;
    }

    /* 認証画面 */
    .auth-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 2rem 1.2rem;
    }

    .auth-box {
      background: white;
      border-radius: var(--card-radius);
      padding: 1.8rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .auth-title {
      font-weight: 800;
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 1rem;
    }

    .custom-input {
      border-radius: 12px;
      border: 2px solid #f0f0f0;
      height: 3rem;
    }

    #app-container {
      display: none;
      height: 100%;
      flex-direction: column;
    }
  </style>
</head>
<body>

<div id="login-container" class="auth-container">
  <div class="has-text-centered mb-6">
    <h1 class="title is-2" style="color: var(--secondary-orange); letter-spacing: -1px;">🪙 サンキューコイン</h1>
  </div>

  <div class="auth-box">
    <h2 class="auth-title">🔑 ログイン</h2>
    <input class="input custom-input mb-4" type="email" id="loginEmail" placeholder="メールアドレス">
    <button id="loginBtn" class="button is-warning is-fullwidth has-text-weight-bold" onclick="doLogin()">社員証をタッチして開始</button>
  </div>

  <div class="auth-box" style="border-top: 6px solid var(--primary-yellow);">
    <h2 class="auth-title">✨ 初めての方（未登録）</h2>
    <p class="is-size-7 mb-3">メールアドレスを入力して、自分のカードを登録してください。</p>
    <input class="input custom-input mb-4" type="email" id="regEmail" placeholder="メールアドレス">
    <div class="columns is-mobile is-gapless mb-2">
      <div class="column pr-1">
        <input class="input is-small custom-input" type="text" id="regNfcInput" placeholder="USB用">
      </div>
      <div class="column is-narrow">
        <button id="regBtn" class="button is-small is-light" onclick="doRegister()">スマホで登録</button>
      </div>
    </div>
  </div>
</div>

<div id="app-container">
  <div class="fixed-top has-text-centered">
    <h1 class="title is-4 mb-2">🪙 サンキューコイン</h1>
    
    <div class="status-card">
      <div class="columns is-mobile">
        <div class="column">
          <p class="heading">残り枚数</p>
          <p class="title is-3 has-text-danger" id="remains">-</p>
        </div>
        <div class="column">
          <p class="heading">もらった枚数</p>
          <p class="title is-3 has-text-success" id="received">-</p>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <textarea id="coinMessage" class="textarea custom-input" placeholder="感謝のメッセージ（任意）" rows="2"></textarea>
    </div>
    </div>

  <div class="px-4">
    <button id="btnSend" class="main-btn">コインをあげる</button>
  </div>

  <div class="scroll-content">
    <p class="subtitle is-6 mb-3 has-text-grey-dark" style="font-weight: bold;">📥 届いたメッセージ</p>
    <div id="message-list"></div>
    <button class="button is-text is-fullwidth has-text-grey mt-5" onclick="logout()">ログアウト</button>
  </div>
</div>

<div id="customModal" class="modal">
  <div class="modal-background" onclick="closeModal()"></div>
  <div class="modal-content px-5">
    <div class="box has-text-centered" style="border-radius: 20px;">
      <div id="modalMsgContent" class="py-4"></div>
      <button class="button is-warning is-fullwidth has-text-weight-bold" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwx574Jbn-tfZtGU1UUUBRHv7G8KfbvMfaMEhGQ60nP-H-aV-L8HQM20rhNg5ACRZCX/exec";

  // 一瞬で切り替えるためのUI制御
  function switchToAppUI() {
    document.getElementById('login-container').style.display = 'none';
    document.getElementById('app-container').style.display = 'flex';
  }

  async function callGas(params) {
    const url = new URL(GAS_URL);
    Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
    const res = await fetch(url.toString(), { redirect: "follow" });
    return await res.json();
  }

  function renderMessages(messages) {
    const list = document.getElementById('message-list');
    list.innerHTML = messages.length ? '' : '<p class="has-text-centered is-size-7 has-text-grey-light mt-5">メッセージはまだありません</p>';
    messages.forEach(m => {
      list.innerHTML += `
        <div class="message-item">
          <div class="msg-header">
            <span class="msg-sender">👤 ${m.senderName} さん</span>
            <span class="msg-date">${m.date}</span>
          </div>
          <div class="msg-body">${m.text || '（メッセージなし）'}</div>
        </div>
      `;
    });
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    if(!email) return alert("アドレスを入力してください");
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById('loginBtn').innerText = "カードを待機中...";
      ndef.onreading = async (event) => {
        const res = await callGas({ action: 'getUserData', email: email, nfcId: event.serialNumber });
        if(res.error) {
          alert(res.error);
          document.getElementById('loginBtn').innerText = "社員証をタッチして開始";
          return;
        }
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userNfc', event.serialNumber);
        updateAppStats(res);
        switchToAppUI();
      };
    } catch(e) { alert("NFCエラー"); }
  }

  function updateAppStats(data) {
    document.getElementById('remains').innerText = data.remains;
    document.getElementById('received').innerText = data.received;
    renderMessages(data.messages || []);
  }

  document.getElementById('btnSend').onclick = async () => {
    const msg = document.getElementById('coinMessage').value;
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById('btnSend').innerText = "相手のカードにタッチ待機中...";
      ndef.onreading = async (event) => {
        const res = await callGas({ action: 'sendPoint', email: localStorage.getItem('userEmail'), nfcId: event.serialNumber, message: msg });
        if(res.error) {
          alert(res.error);
          document.getElementById('btnSend').innerText = "コインをあげる";
        } else {
          document.getElementById('modalMsgContent').innerHTML = `<h3 class="title is-4">🎉 送信完了</h3><p><b>${res.receiver}</b> さんに送りました！</p>`;
          document.getElementById('customModal').classList.add('is-active');
          window.onModalClose = () => location.reload();
        }
      };
    } catch(e) { alert("失敗"); }
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('is-active');
    if(window.onModalClose) window.onModalClose();
  }

  function logout() { localStorage.clear(); location.reload(); }

  // 起動時の処理
  window.onload = async () => {
    const email = localStorage.getItem('userEmail');
    const nfc = localStorage.getItem('userNfc');
    if(email && nfc) {
      // 1. まずUIだけ一瞬で切り替える
      switchToAppUI();
      // 2. 裏でデータを最新にする
      try {
        const res = await callGas({ action: 'getUserData', email, nfcId: nfc });
        updateAppStats(res);
      } catch(e) { console.log("データ取得失敗"); }
    }
  };
</script>
</body>
</html>
