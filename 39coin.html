<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サンキューコイン</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    :root { 
      --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); 
      --bg-color: #f0f2f5;
    }
    body { background-color: var(--bg-color); font-family: 'Hiragino Kaku Gothic ProN', sans-serif; min-height: 100vh; color: #333; }
    .hero { background: var(--primary-gradient); padding: 3.5rem 1rem 5rem 1rem; color: white; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(255, 165, 0, 0.25); }
    .status-card { background: white; border-radius: 24px; padding: 2.5rem 1.5rem; margin-top: -50px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
    .instruction-text { line-height: 1.8; color: #555; margin-bottom: 2rem !important; }
    .custom-input { border-radius: 14px; border: 2px solid #edf2f7; background-color: #f8fafc; height: 3.5rem; }
    .main-btn { height: 120px; font-size: 1.4rem !important; font-weight: 700; border-radius: 20px; box-shadow: 0 8px 20px rgba(255, 165, 0, 0.3); border: none; background: var(--primary-gradient); color: white; }
    .submit-btn { border-radius: 14px; height: 3.5rem; font-weight: 700; }
    .modal-content .box { border-radius: 24px; padding: 2.5rem 2rem; border: none; }
    .modal-background { backdrop-filter: blur(6px); background-color: rgba(0, 0, 0, 0.5); }
    #app-container { display: none; }
  </style>
</head>
<body>

  <div id="login-container">
    <div class="hero has-text-centered">
      <h1 class="title has-text-white is-3 mb-2">🪙 サンキューコイン</h1>
      <p class="subtitle is-6 has-text-white-ter">Smart Recognition System</p>
    </div>
    <div class="container px-5">
      <div class="status-card has-text-centered">
        <h2 class="title is-5 mb-5">初期セットアップ</h2>
        <p class="instruction-text is-size-6">
          社内メールアドレスを入力し、<br>
          <strong>「認証開始」</strong>を押したあとに<br>
          自分の社員証をスマホにかざしてください。
        </p>
        <div class="field mb-5">
          <div class="control">
            <input class="input custom-input" type="email" id="inputEmail" placeholder="example@daiwa-hi.co.jp">
          </div>
        </div>
        <button class="button is-warning is-fullwidth submit-btn has-text-weight-bold" onclick="saveLogin()">認証開始</button>
      </div>
    </div>
  </div>

  <div id="app-container">
    <div class="hero has-text-centered">
      <h1 class="title has-text-white is-3 mb-2">🪙 サンキューコイン</h1>
      <button class="button is-small is-light is-outlined mt-2" style="border-radius: 20px;" onclick="logout()">ログアウト</button>
    </div>
    <div class="container px-5">
      <div class="status-card has-text-centered mb-6">
        <div class="columns is-mobile">
          <div class="column">
            <p class="heading has-text-grey">あげる残り</p>
            <p class="title is-2 has-text-danger"><span id="remains">-</span><span class="is-size-6"> 枚</span></p>
          </div>
          <div class="column">
            <p class="heading has-text-grey">もらった累計</p>
            <p class="title is-2 has-text-success"><span id="received">-</span><span class="is-size-6"> 枚</span></p>
          </div>
        </div>
      </div>
      <button id="btnRead" class="button is-warning is-fullwidth main-btn mb-5">
        コインをあげる<br><span class="is-size-6 mt-1">(NFCタッチ)</span>
      </button>
      <p id="statusMsg" class="has-text-centered has-text-grey is-size-7">※相手のカードにゆっくりタッチしてください</p>
    </div>
  </div>

  <div id="customModal" class="modal">
    <div class="modal-background" onclick="closeModal()"></div>
    <div class="modal-content px-5">
      <div class="box has-text-centered">
        <h2 id="modalTitle" class="title is-4 mt-2 mb-5"></h2>
        <p id="modalMessage" class="subtitle is-6 mb-6" style="line-height: 1.8;"></p>
        <button class="button is-warning is-fullwidth is-medium has-text-weight-bold" style="border-radius: 14px;" onclick="closeModal()">OK</button>
      </div>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // 84行目：ここにGASのURLを貼り付けてください
    // -----------------------------------------------------------------
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwx574Jbn-tfZtGU1UUUBRHv7G8KfbvMfaMEhGQ60nP-H-aV-L8HQM20rhNg5ACRZCX/exec";

    function speakThankYou() {
      const uttr = new SpeechSynthesisUtterance("サンキュー！");
      uttr.lang = "ja-JP"; uttr.rate = 1.2; uttr.pitch = 1.5;
      window.speechSynthesis.speak(uttr);
    }

    let modalCallback = null;
    function showModal(title, message, callback = null, sound = false) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerHTML = message.replace(/\n/g, '<br>');
      document.getElementById('customModal').classList.add('is-active');
      modalCallback = callback;
      if (sound) speakThankYou();
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('is-active');
      if (modalCallback) { modalCallback(); modalCallback = null; }
    }

    const myEmail = localStorage.getItem('userEmail');
    const myNfc = localStorage.getItem('userNfc');

    if (myEmail && myNfc) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      loadUserData(myEmail, myNfc);
    }

    async function saveLogin() {
      const email = document.getElementById('inputEmail').value.trim();
      if(!email) return showModal("エラー", "メールアドレスを入力してください");
      showModal("認証中", "そのままご自身の社員証をタッチしてください");
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        ndef.onreading = async (event) => {
          const nfcId = event.serialNumber;
          try {
            await callGas({ action: 'getUserData', email: email, nfcId: nfcId });
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userNfc', nfcId);
            showModal("完了", "ログインしました！", () => location.reload());
          } catch(e) { showModal("認証失敗", e.message); }
        };
      } catch (e) { showModal("エラー", "NFCを起動できません"); }
    }

    async function callGas(params) {
      const url = new URL(GAS_URL);
      Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
      const response = await fetch(url.toString(), { redirect: "follow" });
      const data = await response.json();
      if(data.error) throw new Error(data.error);
      return data;
    }

    async function loadUserData(email, nfcId) {
      try {
        const data = await callGas({ action: 'getUserData', email: email, nfcId: nfcId });
        document.getElementById('remains').innerText = data.remains;
        document.getElementById('received').innerText = data.received;
      } catch(e) { showModal("認証エラー", e.message, logout); }
    }

    function logout() { localStorage.clear(); location.reload(); }

    document.getElementById('btnRead').onclick = async () => {
      const btn = document.getElementById('btnRead');
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        btn.classList.add('is-loading');
        ndef.onreading = async (event) => {
          try {
            const res = await callGas({ action: 'sendPoint', email: myEmail, nfcId: event.serialNumber });
            showModal("🎉 送信完了！", `${res.receiver} さんへ<br>1コイン贈りました！`, () => location.reload(), true);
          } catch(e) { showModal("エラー", e.message, () => location.reload()); }
        };
      } catch (e) { showModal("エラー", "NFC失敗"); }
    };
  </script>
</body>
</html>
