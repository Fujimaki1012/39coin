<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サンキューコイン</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      --bg-color: #f0f2f5;
      --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      --accent-color: #FFA500;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Hiragino Kaku Gothic ProN', 'ヒラギノ角ゴ ProN W3', sans-serif;
      min-height: 100vh;
      color: #333;
      padding-bottom: 2rem;
    }

    /* ヘッダー */
    .hero {
      background: var(--primary-gradient);
      padding: 3.5rem 1rem 5rem 1rem;
      color: white;
      border-radius: 0 0 35px 35px;
      box-shadow: 0 4px 15px rgba(255, 165, 0, 0.2);
    }

    .hero .title {
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem !important; /* バージョンとの間隔を詰める */
    }

    /* バージョン表記のスタイル */
    .version-tag {
      font-size: 0.75rem;
      opacity: 0.85;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* メインカード */
    .status-card {
      background: white;
      border-radius: 24px;
      padding: 2rem 1.5rem;
      margin-top: -50px;
      box-shadow: var(--card-shadow);
    }

    .field-label-custom {
      font-size: 0.85rem;
      font-weight: bold;
      color: #666;
      margin-bottom: 0.5rem;
      display: block;
      text-align: left;
    }

    .custom-input {
      border-radius: 14px;
      border: 2px solid #edf2f7;
      background-color: #f8fafc;
      transition: all 0.3s ease;
    }

    .custom-input:focus {
      border-color: var(--accent-color);
      background-color: #fff;
    }

    .main-btn {
      height: 110px;
      font-size: 1.3rem !important;
      font-weight: 800;
      border-radius: 20px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      box-shadow: 0 8px 20px rgba(255, 165, 0, 0.3);
    }

    .test-reg-box {
      margin-top: 3rem;
      padding: 1.8rem;
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      background: #ffffff;
    }

    .reg-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .modal-quote {
      background: #fff9eb;
      padding: 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #555;
      border-left: 5px solid var(--accent-color);
      text-align: left;
      margin-top: 1rem;
    }

    #app-container {
      display: none;
    }
  </style>
</head>
<body>

<div id="login-container">
  <div class="hero has-text-centered">
    <h1 class="title has-text-white is-3">🪙 サンキューコイン</h1>
    <div class="version-tag has-text-white-bis">Ver. 1.0.0</div>
  </div>
  <div class="container px-5">
    <div class="status-card has-text-centered">
      <h2 class="title is-5 mb-5">ログイン</h2>
      <div class="field mb-4">
        <label class="field-label-custom">メールアドレス</label>
        <input class="input custom-input" type="email" id="loginEmail" placeholder="example@daiwa-hi.co.jp">
      </div>
      <button id="loginBtn" class="button is-warning is-fullwidth has-text-weight-bold" style="height: 3.8rem; border-radius: 14px;" onclick="doLogin()">
        社員証をタッチしてログイン
      </button>
      
      <div class="test-reg-box">
        <p class="reg-title">【登録】初めての方はこちら</p>
        <div class="field mb-3">
          <input class="input is-small custom-input" type="text" id="regNfcInput" placeholder="USBスキャナでスキャン (Enter)">
        </div>
        <button id="regBtn" class="button is-small is-light is-fullwidth has-text-weight-bold" style="border-radius: 10px;" onclick="doRegister()">
          スマホのNFCで登録
        </button>
      </div>
    </div>
  </div>
</div>

<div id="app-container">
  <div class="hero has-text-centered">
    <h1 class="title has-text-white is-4">🪙 サンキューコイン</h1>
    <div class="version-tag has-text-white-bis opacity-75">Ver. 1.0.0</div>
    <p id="myEmailDisp" class="is-size-7 has-text-white-bis mt-2" style="letter-spacing: 0.05em;"></p>
  </div>
  <div class="container px-5">
    <div class="status-card has-text-centered mb-5">
      <div class="columns is-mobile">
        <div class="column">
          <p class="heading">あげる残り</p>
          <p class="title is-2 has-text-danger" id="remains">-</p>
        </div>
        <div class="column">
          <p class="heading">もらった累計</p>
          <p class="title is-2 has-text-success" id="received">-</p>
        </div>
      </div>
    </div>

    <div class="field mb-5">
      <label class="field-label-custom">感謝のメッセージ</label>
      <textarea id="coinMessage" class="textarea custom-input" placeholder="「いつも助かってます！」など" rows="3"></textarea>
    </div>

    <button id="btnSend" class="button is-warning is-fullwidth main-btn">
      コインをあげる<br>
      <span class="is-size-7 mt-2" style="font-weight: 400;">(相手のカードにタッチ)</span>
    </button>
    
    <a href="javascript:void(0)" class="is-block has-text-centered mt-6 has-text-grey is-size-7" onclick="logout()">ログアウト</a>
  </div>
</div>

<div id="customModal" class="modal">
  <div class="modal-background" onclick="closeModal()"></div>
  <div class="modal-content px-5">
    <div class="box has-text-centered" style="border-radius: 24px;">
      <div id="modalMsgContent"></div>
      <button class="button is-warning is-fullwidth has-text-weight-bold mt-5" style="height: 3.5rem; border-radius: 14px;" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
  // ★重要：デプロイしたURLをここに貼り付け
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwx574Jbn-tfZtGU1UUUBRHv7G8KfbvMfaMEhGQ60nP-H-aV-L8HQM20rhNg5ACRZCX/exec";

  function speak(text) {
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = "ja-JP"; uttr.rate = 1.2; uttr.pitch = 1.5;
    window.speechSynthesis.speak(uttr);
  }

  function showCustomModal(title, htmlBody, callback = null) {
    document.getElementById('modalMsgContent').innerHTML = `<h3 class="title is-4 mb-4">${title}</h3><div>${htmlBody}</div>`;
    document.getElementById('customModal').classList.add('is-active');
    window.modalCloseCallback = callback;
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('is-active');
    if (window.modalCloseCallback) { window.modalCloseCallback(); window.modalCloseCallback = null; }
  }

  // ログイン
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    if(!email) return alert("メールアドレスを入力してください");
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById('loginBtn').innerText = "カードを待機中...";
      ndef.onreading = async (event) => {
        const res = await callGas({ action: 'getUserData', email: email, nfcId: event.serialNumber });
        if(res.error) { 
          alert(res.error); 
          document.getElementById('loginBtn').innerText = "社員証をタッチしてログイン"; 
          return; 
        }
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userNfc', event.serialNumber);
        location.reload();
      };
    } catch(e) { alert("NFCエラー: AndroidのChromeを使用してください"); }
  }

  // 登録（スマホ）
  async function doRegister() {
    const email = document.getElementById('loginEmail').value.trim();
    if(!email) return alert("先にメールアドレスを入力してください");
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById('regBtn').innerText = "カードをかざしてください...";
      ndef.onreading = event => {
        google.script.run.withSuccessHandler(m => {
          alert(m);
          document.getElementById('regBtn').innerText = "スマホのNFCで登録";
          speak("登録完了");
        }).processRegistration(email, event.serialNumber);
      };
    } catch(e) { alert("NFC非対応です"); }
  }

  // USBスキャン（Enterキー）
  document.getElementById('regNfcInput').addEventListener('keypress', async (e) => {
    if (e.key === 'Enter') {
      const email = document.getElementById('loginEmail').value.trim();
      if(!email) return alert("メールアドレスを入力してください");
      google.script.run.withSuccessHandler(m => {
        alert(m);
        speak("登録完了");
      }).processRegistration(email, e.target.value);
      e.target.value = "";
    }
  });

  // 送信
  document.getElementById('btnSend').onclick = async () => {
    const msg = document.getElementById('coinMessage').value.trim();
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById('btnSend').innerText = "相手のカードを待機中...";
      ndef.onreading = async (event) => {
        const res = await callGas({ 
          action: 'sendPoint', 
          email: localStorage.getItem('userEmail'), 
          nfcId: event.serialNumber, 
          message: msg 
        });
        
        if(res.error) { 
          alert(res.error); 
          location.reload(); 
        } else {
          speak("サンキュー");
          let body = `<p><strong>${res.receiver}</strong> さんに<br>1コイン送りました！</p>`;
          if (msg) body += `<div class="modal-quote">「${msg}」</div>`;
          showCustomModal("🎉 送信完了！", body, () => location.reload());
        }
      };
    } catch(e) { alert("NFC失敗"); }
  };

  async function callGas(params) {
    const url = new URL(GAS_URL);
    Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
    const response = await fetch(url.toString(), { redirect: "follow" });
    return await response.json();
  }

  function logout() { localStorage.clear(); location.reload(); }

  window.onload = async () => {
    const email = localStorage.getItem('userEmail');
    const nfc = localStorage.getItem('userNfc');
    if(email && nfc) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      document.getElementById('myEmailDisp').innerText = email;
      
      const res = await callGas({ action: 'getUserData', email: email, nfcId: nfc });
      if(!res.error) {
        document.getElementById('remains').innerText = res.remains;
        document.getElementById('received').innerText = res.received;
      }
    }
  };
</script>
</body>
</html>
